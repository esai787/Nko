<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D2C5E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Apprendre le N’ko</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Noto+Sans+NKo&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F2F4F8;--ink:#172036;--muted:#566177;--card:#fff;--line:#D3D9E6;--accent:#2F4BA8;--on:#fff;--ok:#1E7A4F;--bad:#B3382C;--hero:#1D2C5E;--gold:#F2D27A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0F1424;--ink:#E8ECF6;--muted:#9AA5BD;--card:#182038;--line:#2A3556;--accent:#8FA6F0;--on:#0F1424;--ok:#5CCB93;--bad:#F08A7E}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F1424;--ink:#E8ECF6;--muted:#9AA5BD;--card:#182038;--line:#2A3556;--accent:#8FA6F0;--on:#0F1424;--ok:#5CCB93;--bad:#F08A7E}
html,body{margin:0}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
main{max-width:34rem;margin:0 auto;padding:1.25rem 1rem 3rem}
h1{font-size:1.6rem;font-weight:800;margin:0}
.sub{color:var(--muted);margin:.25rem 0 1rem}
.tabs{display:flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:.75rem;padding:.25rem;margin-bottom:.75rem}
.tabs button{flex:1;font:inherit;font-weight:600;padding:.55rem;border:0;border-radius:.55rem;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"],.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on)}
#les{flex-wrap:wrap}
#les button{flex:1 1 45%;font-size:.9rem;padding:.5rem .25rem}
.play{margin-top:.75rem;font:inherit;font-weight:600;padding:.5rem 1.25rem;border-radius:2rem;border:2px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer}
.hero{background:var(--hero);color:#EEF1FA;border-radius:1.25rem;padding:1.25rem 1rem 1.5rem;text-align:center}
.big{font-family:"Noto Sans NKo","Ebrima","Nirmala UI",sans-serif;font-size:7.5rem;line-height:1.15;color:var(--gold)}
.big.lat{font-family:inherit;font-weight:800;font-size:4.5rem}
.big.lat.sm{font-size:2.2rem}
.big.long{font-size:3rem;line-height:1.5}
.tile.wide{font-size:1.05rem;padding:.8rem .25rem}
.grid:has(.wide){grid-template-columns:repeat(2,1fr)}
.snd{font-size:1.5rem;font-weight:800;margin:0}
.ex{margin:.25rem 0 0;color:#C9D1EA}
.nko,.tile{font-family:"Noto Sans NKo","Ebrima","Nirmala UI",sans-serif}
.syl{margin:1rem 0 0}
.syl .nko{font-size:1.6rem;margin:0 .35rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(4rem,1fr));gap:.5rem;margin-top:1rem}
.tile{font-size:2rem;padding:.5rem 0;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:.75rem;cursor:pointer}
.tile[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.note{color:var(--muted);font-size:.9rem}
.prog{color:var(--muted);margin:0 0 .5rem;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1rem}
.opt{font:inherit;font-size:1.25rem;font-weight:600;padding:.9rem .5rem;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:.75rem;cursor:pointer}
.opt.nko{font-size:2.2rem;font-weight:400}
.opt.ok{border-color:var(--ok)}
.opt.bad{border-color:var(--bad)}
#fb{min-height:1.5rem;font-weight:600;margin:1rem 0 .5rem}
.act{font:inherit;font-weight:600;padding:.75rem 1.25rem;border:0;border-radius:.75rem;background:var(--accent);color:var(--on);cursor:pointer}
.score{font-size:3rem;font-weight:800;margin:0}
.pad{position:relative;border:2px solid var(--line);border-radius:1rem;background:var(--card);overflow:hidden;margin-top:.75rem}
.pad canvas{display:block;width:100%;height:auto}
.pad #cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.wact{display:flex;gap:.5rem;margin-top:.75rem;flex-wrap:wrap}
.act.alt{background:transparent;color:var(--accent);border:2px solid var(--accent)}
[role="tablist"] button{font-size:.92rem;padding:.55rem .2rem}
.out{min-height:5.5rem;font-family:"Noto Sans NKo","Ebrima","Nirmala UI",sans-serif;font-size:2rem;line-height:1.6;padding:.75rem 1rem;border:2px solid var(--line);border-radius:1rem;background:var(--card);white-space:pre-wrap;word-break:break-all;user-select:text}
.out:empty::before{content:"Touche les lettres ci-dessous pour écrire";color:var(--muted);font-size:1rem;font-family:"Bricolage Grotesque",system-ui,sans-serif}
.kh{font-size:.95rem;margin:1rem 0 .4rem;color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(3rem,1fr));gap:.4rem}
.kb{font-family:"Noto Sans NKo","Ebrima","Nirmala UI",sans-serif;font-size:1.6rem;padding:.4rem 0;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:.6rem;cursor:pointer}
.kb:active{background:var(--accent);color:var(--on)}
.fld{display:block;margin-top:.9rem;font-weight:600}
.fld textarea,.fld input{display:block;width:100%;box-sizing:border-box;margin-top:.3rem;font:inherit;font-weight:400;padding:.6rem .75rem;border:2px solid var(--line);border-radius:.75rem;background:var(--card);color:var(--ink)}
.fld textarea{min-height:5rem;resize:vertical}
.foot{text-align:center;margin-top:2rem}
.linkbtn{font:inherit;background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer}
.pl{margin-top:1rem;padding:.9rem 1rem;border:2px solid var(--line);border-radius:1rem;background:var(--card)}
.plh{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.bar{height:.6rem;background:var(--line);border-radius:1rem;margin:.5rem 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.rv{margin:.4rem 0 0}
.act.sm{padding:.3rem .8rem;font-size:.9rem}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>

<main>
<h1>Apprendre le N’ko</h1>
<p class="sub" id="sub"></p>
<div class="tabs" id="les">

<button data-les="con" aria-pressed="false">2. Consonnes</button>
<button data-les="con2" aria-pressed="false">3. Consonnes (suite)</button>

<button data-les="ton" aria-pressed="false">5. Nasales et tons</button>
<button data-les="mot" aria-pressed="false">6. Premiers mots</button>
<button data-les="phr" aria-pressed="false">7. Salutations</button>
</div>
<div class="tabs" role="tablist">
<button role="tab" id="t-learn" data-tab="learn" aria-selected="true">Apprendre</button>
<button role="tab" id="t-quiz" data-tab="quiz" aria-selected="false">Quiz</button>
<button role="tab" id="t-write" data-tab="write" aria-selected="false">Écrire</button>
<button role="tab" id="t-kb" data-tab="kb" aria-selected="false">Clavier</button>
</div>
<div id="learn"></div>
<div id="quiz" hidden></div>
<div id="write" hidden></div>
<div id="kb" hidden></div>
<div id="fb" hidden></div>
<div id="prog" hidden></div>
<p class="foot"><button class="linkbtn" data-tab="prog">Ma progression</button>  |  <button class="linkbtn" data-tab="fb">Donner mon avis</button></p>
<p class="foot" id="inst" hidden><button class="act" id="instbtn">Installer l’application</button></p>
<p class="note" id="ios" style="text-align:center" hidden>Sur iPhone : touche « Partager », puis « Sur l’écran d’accueil ».</p>
</main>

function play(){const u=AUD[I()[sel].g];if(u){new Audio(u).play().catch(()=>{});}else $('#aud').textContent='L’enregistrement de cette lettre n’est pas encore disponible.';}
const rd=v=>v.r||v.s;

const WD=()=>cur==="mot"||cur==="phr";
const EX=v=>cur==="num"?`en français : ${v.ex}`:cur==="ton"?v.ex:WD()?`signifie : ${v.ex}`:`comme dans « ${v.ex} »`;
function syl(v){
 if(cur==="num"||cur==="ton"||WD())return null;
 return cur==="voy"
  ?{i:"Avec la consonne ߓ (b) :",t:"ߓ"+v.g,r:"b"+rd(v)}
  :{i:"Avec la voyelle ߊ (a) :",t:v.g+"ߊ",r:v.s+"a"};
}

function learn(){
 const v=I()[sel],y=syl(v);
 $('#sub').textContent=LES[cur].t;
 $('#learn').innerHTML=`<section class="hero"><div class="big${cur==="phr"?" long":""}" lang="nqo" dir="rtl">${v.g}</div>
 <p class="snd">${v.s}</p><p class="ex">${EX(v)}</p>${cur==="num"||cur==="ton"||WD()?"":'<button class="play" id="play">▶ Écouter</button>'}</section>
 <p class="note" id="aud" aria-live="polite"></p>
 ${y?`<p class="syl">${y.i}<span class="nko" lang="nqo" dir="rtl">${y.t}</span>se lit <b>${y.r}</b></p>`:""}
 <div class="grid">${I().map((x,i)=>`<button class="tile${cur==="phr"?" wide":""}" lang="nqo" aria-pressed="${i===sel}" aria-label="${LES[cur].nom.slice(0,-1)} ${x.s}" data-i="${i}">${x.g}</button>`).join('')}</div>
 <p class="note">Le N’ko s’écrit de droite à gauche. Touche une lettre pour la découvrir.</p>`;
}

function start(only){Q=sh(only&&only.length?only:I()).map(v=>({v,m:Math.random()<.5?0:1}));qi=0;score=0;ask();}

function ask(){
 if(qi>=Q.length){finish();return;}
 const {v,m}=Q[qi];
 const opts=sh([v,...sh(I().filter(x=>x!==v)).slice(0,3)]);
 answered=false;
 $('#quiz').innerHTML=`<p class="prog">Question ${qi+1} sur ${Q.length}</p>
 <section class="hero">${m===0
  ?`<div class="big${cur==="phr"?" long":""}" lang="nqo" dir="rtl">${v.g}</div><p class="ex">${cur==="num"?"Quel est ce chiffre ?":cur==="ton"?"Quel est ce signe ?":WD()?(cur==="phr"?"Comment se lit cette expression ?":"Comment se lit ce mot ?"):"Quel est ce son ?"}</p>`
  :`<div class="big lat${cur==="ton"||cur==="phr"?" sm":""}">${v.s}</div><p class="ex">${cur==="num"?`${v.ex} : quel chiffre N’ko ?`:cur==="ton"?`${v.ex} : quel signe ?`:WD()?`${EX(v)} : quelle écriture N’ko ?`:`${EX(v)} : quelle lettre ?`}</p>`}</section>
 <div class="opts">${opts.map(o=>`<button class="opt${m?' nko':''}" ${m?'lang="nqo"':''} data-k="${I().indexOf(o)}">${m?o.g:o.s}</button>`).join('')}</div>
 <p id="fb" aria-live="polite"></p><button class="act" id="next" hidden>Suivant</button>`;
}

function pick(btn){
 if(answered)return;answered=true;
 const {v,m}=Q[qi],right=I().indexOf(v),k=+btn.dataset.k,good=k===right;
 if(good)score++;rec(good,v.g);
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.k===right)b.classList.add('ok');});
 if(!good)btn.classList.add('bad');
 $('#fb').innerHTML=good?'✓ Bravo !':`✗ C’était <span class="${m?'nko':''}" ${m?'lang="nqo"':''}>${m?v.g:v.s}</span>.`;
 const n=$('#next');n.hidden=false;n.textContent=qi===Q.length-1?'Voir mon score':'Suivant';n.focus();
}

function finish(){
 let best=score;
 try{const key=cur==="voy"?'nko-best':'nko-best-'+cur;const old=+localStorage.getItem(key)||0;best=Math.max(old,score);localStorage.setItem(key,best);}catch(e){}
 $('#quiz').innerHTML=`<section class="hero"><p class="score">${score} / ${Q.length}</p>
 <p class="ex">Meilleur score : ${best} / ${Q.length}</p></section>
 <p>${score===Q.length?`Parfait ! Tu connais les ${Q.length} ${LES[cur].nom}.`:'Retourne dans « Apprendre » pour revoir les lettres, puis réessaie.'}</p>
 <button class="act" id="again">Recommencer le quiz</button>`;
}

function tab(n){
 $('#learn').hidden=n!=='learn';$('#quiz').hidden=n!=='quiz';$('#write').hidden=n!=='write';$('#t-write').setAttribute('aria-selected',n==='write');$('#kb').hidden=n!=='kb';$('#fb').hidden=n!=='fb';$('#prog').hidden=n!=='prog';$('#t-kb').setAttribute('aria-selected',n==='kb');
 $('#t-learn').setAttribute('aria-selected',n==='learn');$('#t-quiz').setAttribute('aria-selected',n==='quiz');
 if(n==='quiz'&&!Q.length)start();
 if(n==='write')writeView();
 if(n==='kb')kbView();
 if(n==='fb')fbView();
 if(n==='prog')progView();
}

function lesson(k){
 cur=k;sel=0;Q=[];
 document.querySelectorAll('[data-les]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.les===k));
 learn();
 if(!$('#quiz').hidden)start();
 wsel=0;if(!$('#write').hidden)writeView();
}

let ST={};try{ST=JSON.parse(localStorage.getItem('nko-stats')||'{}');}catch(e){}
function rec(good,g){const L=ST[cur]=ST[cur]||{};const r=L[g]=L[g]||{ok:0,ko:0,last:null};if(good)r.ok++;else r.ko++;r.last=good?1:0;try{localStorage.setItem('nko-stats',JSON.stringify(ST));}catch(e){}}
function progView(){
 let A=0,T=0;
 const rows=Object.keys(LES).map(k=>{
  const L=LES[k],S=ST[k]||{};
  const ok=L.it.filter(x=>S[x.g]&&S[x.g].ok>=2&&S[x.g].last===1).length;
  const rev=L.it.filter(x=>S[x.g]&&S[x.g].last===0);
  const pct=Math.round(100*ok/L.it.length);A+=ok;T+=L.it.length;
  let b=0;try{b=+localStorage.getItem(k==='voy'?'nko-best':'nko-best-'+k)||0;}catch(e){}
  return `<div class="pl"><div class="plh"><b>${L.t}</b><span>${pct===100?'✓ Terminée':ok+' / '+L.it.length+' acquis'}</span></div>
 <div class="bar" role="progressbar" aria-label="${L.t}" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
 ${b?`<p class="note" style="margin:.2rem 0">Meilleur score au quiz : ${b} / ${L.it.length}</p>`:''}
 ${rev.length?`<p class="rv">À revoir : <span class="nko" lang="nqo" dir="rtl">${rev.map(x=>x.g).join(' ')}</span> <button class="act alt sm" data-rev="${k}">Réviser</button></p>`:''}</div>`;}).join('');
 $('#prog').innerHTML=`<h2 style="font-size:1.2rem;margin:0">Ma progression</h2>
 <p class="note">Un élément est « acquis » quand tu l’as réussi au moins 2 fois au quiz et que ta dernière réponse était juste. La progression est gardée sur cet appareil.</p>
 <p style="font-weight:600;margin:.5rem 0 0">Au total : ${A} / ${T} acquis</p>${rows}
 <div class="wact"><button class="act alt" data-tab="learn">Retour</button><button class="act alt" id="preset">Effacer ma progression</button></div>`;
}
function review(k){
 cur=k;sel=0;Q=[];
 document.querySelectorAll('[data-les]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.les===k));
 learn();
 const S=ST[k]||{};const sub=I().filter(x=>S[x.g]&&S[x.g].last===0);
 tab('quiz');start(sub);
}
let armed=false;
function presetClick(){
 const b=$('#preset');
 if(!armed){armed=true;b.textContent='Confirmer l’effacement';return;}
 armed=false;ST={};
 try{localStorage.removeItem('nko-stats');Object.keys(LES).forEach(k=>localStorage.removeItem(k==='voy'?'nko-best':'nko-best-'+k));}catch(e){}
 progView();
}
const CONTACT={wa:'',mail:''};
function fbMsg(){const v=i=>($('#'+i).value||'').trim()||'—';return `Avis sur l’application N’ko\nPrénom : ${v('f0')}\nCe qui est clair : ${v('f1')}\nCe qui est difficile : ${v('f2')}\nÀ ajouter : ${v('f3')}`;}
function fbView(){
 const has=CONTACT.wa||CONTACT.mail;
 $('#fb').innerHTML=`<h2 style="font-size:1.2rem;margin:0">Donner mon avis</h2>
 <p class="note">Ton avis aide à améliorer l’application. Tous les champs sont facultatifs.</p>
 <label class="fld">Ton prénom<input id="f0" autocomplete="given-name"></label>
 <label class="fld">Ce qui est clair<textarea id="f1"></textarea></label>
 <label class="fld">Ce qui est difficile ou ne marche pas<textarea id="f2"></textarea></label>
 <label class="fld">Ce que tu voudrais apprendre ensuite<textarea id="f3"></textarea></label>
 <div class="wact">${CONTACT.wa?'<button class="act" id="fwa">Envoyer par WhatsApp</button>':''}${CONTACT.mail?'<button class="act" id="fmail">Envoyer par e-mail</button>':''}<button class="act ${has?'alt':''}" id="fcopy">Copier mon message</button><button class="act alt" data-tab="learn">Retour</button></div>
 <p id="fmsg" class="note" aria-live="polite">${has?'':'Copie ton message, puis envoie-le à la personne qui t’a donné le lien.'}</p>`;
}
async function fbSend(k){
 const m=$('#fmsg'),msg=fbMsg();
 if(k==='copy'){try{await navigator.clipboard.writeText(msg);m.textContent='Message copié. Tu peux le coller et l’envoyer.';}catch(e){m.textContent='Copie impossible ici. Sélectionne le texte et copie-le à la main.';}return;}
 if(k==='wa')window.open(`https://wa.me/${CONTACT.wa}?text=${encodeURIComponent(msg)}`,'_blank');
 else location.href=`mailto:${CONTACT.mail}?subject=${encodeURIComponent('Avis sur l’application N’ko')}&body=${encodeURIComponent(msg)}`;
 m.textContent='Si rien ne s’ouvre, utilise « Copier mon message ».';
}
let txt='';
const R=(a,b)=>Array.from({length:b-a+1},(_,i)=>String.fromCharCode(a+i));
const KB=[['Voyelles',R(0x7CA,0x7D0)],
['Consonnes',[0x7D3,0x7D4,0x7D5,0x7D6,0x7D7,0x7D8,0x7D9,0x7DA,0x7DB,0x7DC,0x7DD,0x7DE,0x7DF,0x7E1,0x7E2,0x7E3,0x7E4,0x7E5,0x7E6,0x7D2].map(c=>String.fromCharCode(c))],
['Chiffres',R(0x7C0,0x7C9)],['Tons et nasales',R(0x7EB,0x7F2)],['Ponctuation',R(0x7F8,0x7F9)]];
function kbView(){
 const rows=KB.map(([t,a])=>`<h3 class="kh">${t}</h3><div class="keys">${a.map(c=>{const k=c.charCodeAt(0);return `<button class="kb" lang="nqo" data-c="${k}">${k>=0x7EB&&k<=0x7F3?'◌'+c:c}</button>`;}).join('')}</div>`).join('');
 $('#kb').innerHTML=`<div class="out" id="out" dir="rtl" lang="nqo" aria-live="polite">${txt}</div>
 <div class="wact"><button class="act alt" id="kspace">Espace</button><button class="act alt" id="kback">⌫ Effacer</button><button class="act alt" id="kclr">Tout effacer</button><button class="act" id="kcopy">Copier</button></div>
 <p id="kmsg" class="note" aria-live="polite"></p>${rows}`;
}
async function kcopy(){const m=$('#kmsg');try{await navigator.clipboard.writeText(txt);m.textContent=txt?'Texte copié.':'Rien à copier.';}catch(e){m.textContent='Copie impossible ici. Appuie longuement sur le texte pour le sélectionner.';}}
let wsel=0,guide=true,drawing=false,last=null;
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function drawGuide(){
 const g=$('#gc');if(!g)return;const c=g.getContext('2d');c.clearRect(0,0,g.width,g.height);
 const t=I()[wsel].g;let size=320;c.direction='rtl';c.textAlign='center';c.textBaseline='middle';
 const f=()=>`${size}px "Noto Sans NKo","Ebrima","Nirmala UI",sans-serif`;
 c.font=f();while(c.measureText(t).width>520&&size>80){size-=20;c.font=f();}
 c.globalAlpha=.2;c.fillStyle=cssv('--ink')||'#000';c.fillText(t,g.width/2,g.height/2);c.globalAlpha=1;
}
function clearPad(){const c=$('#cv');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);}
function writeView(){
 $('#write').innerHTML=`<p class="prog">Trace la lettre avec ton doigt, puis compare avec le modèle.</p>
 <div class="pad"><canvas id="gc" width="600" height="420" ${guide?'':'style="visibility:hidden"'}></canvas><canvas id="cv" width="600" height="420" aria-label="Zone de dessin"></canvas></div>
 <div class="wact"><button class="act" id="clr">Effacer</button><button class="act alt" id="gd">${guide?'Cacher le modèle':'Afficher le modèle'}</button></div>
 <div class="grid">${I().map((x,i)=>`<button class="tile${cur==="phr"?" wide":""}" lang="nqo" aria-pressed="${i===wsel}" data-w="${i}">${x.g}</button>`).join('')}</div>
 <p class="note">Il n’y a pas de correction automatique : le but est de t’entraîner à la main.</p>`;
 const cv=$('#cv'),x=cv.getContext('2d');
 x.lineWidth=14;x.lineCap='round';x.lineJoin='round';x.strokeStyle=cssv('--accent')||'#2F4BA8';
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
 cv.onpointerdown=e=>{drawing=true;last=pt(e);cv.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(last[0]+.1,last[1]);x.stroke();};
 cv.onpointermove=e=>{if(!drawing)return;const p=pt(e);x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(p[0],p[1]);x.stroke();last=p;};
 cv.onpointerup=cv.onpointercancel=()=>{drawing=false;};
 drawGuide();
 if(document.fonts&&document.fonts.load)document.fonts.load('100px "Noto Sans NKo"').then(drawGuide,drawGuide);
}

document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.w!==undefined){wsel=+t.dataset.w;writeView();$(`[data-w="${wsel}"]`).focus();}
 else if(t.classList.contains('tile')){sel=+t.dataset.i;learn();$(`.tile[data-i="${sel}"]`).focus();}
 else if(t.dataset.les)lesson(t.dataset.les);
 else if(t.dataset.tab)tab(t.dataset.tab);
 else if(t.classList.contains('opt'))pick(t);
 else if(t.id==='next'){qi++;ask();}
 else if(t.id==='again')start();
 else if(t.id==='play')play();
 else if(t.classList.contains('kb')){txt+=String.fromCharCode(+t.dataset.c);$('#out').textContent=txt;}
 else if(t.id==='kspace'){txt+=' ';$('#out').textContent=txt;}
 else if(t.id==='kback'){txt=Array.from(txt).slice(0,-1).join('');$('#out').textContent=txt;}
 else if(t.id==='kclr'){txt='';$('#out').textContent=txt;}
 else if(t.id==='kcopy')kcopy();
 else if(t.dataset.rev)review(t.dataset.rev);
 else if(t.id==='preset')presetClick();
 else if(t.id==='fcopy')fbSend('copy');
 else if(t.id==='fwa')fbSend('wa');
 else if(t.id==='fmail')fbSend('mail');
 else if(t.id==='clr')clearPad();
 else if(t.id==='gd'){guide=!guide;writeView();}
});
learn();
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai$/.test(location.hostname))navigator.serviceWorker.register('sw.js');}catch(e){}
let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('#inst').hidden=false;});
document.addEventListener('click',e=>{if(e.target.id==='instbtn'&&dip){dip.prompt();dip=null;$('#inst').hidden=true;}});
if(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone)$('#ios').hidden=false;
</script>
</body>
</html>
